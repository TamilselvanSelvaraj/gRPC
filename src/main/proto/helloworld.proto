syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.ford.demo.grpc";

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

service FordGrpcDemo {
  rpc SayFord (RequestFord) returns (ResponseFord) {}
}

message RequestFord {
  string name = 1;
}

message ResponseFord {
  string message = 1;
}