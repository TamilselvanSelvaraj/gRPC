// compiling Java source code, running tests
apply plugin: 'java'

// Apply the 'com.google.protobuf' plugin, which provides tasks for
// compiling Protocol Buffer (.proto) files into Java source code.
apply plugin: 'com.google.protobuf'

// Define the group ID for this project. This is typically used for
// artifact coordinates in a repository (e.g., Maven, Artifactory).
group 'com.ford.demo'

// Define the version of the project artifact that will be built.
// 'SNAPSHOT' indicates that it's a work-in-progress version.
version '1.0-SNAPSHOT'

// Configuration block for the build script itself.
buildscript {
    // Define repositories where the build script can find its own dependencies.
    repositories {
        // Maven Central repository, a common source for Java libraries.
        mavenCentral()
        // Gradle Plugin Portal, where many Gradle plugins are hosted.
        gradlePluginPortal()
    }
    // Define dependencies required by the build script.
    dependencies {
        // This line adds the Protobuf Gradle plugin as a dependency for the build script.
        // It's needed to enable the 'apply plugin: 'com.google.protobuf'' directive.
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
    }
}

// Define the project's runtime and compile-time dependencies.
dependencies {
    // gRPC dependencies:

    // Implementation dependency for gRPC, using Netty for network communication.
    // The 'shaded' version bundles all its transitive dependencies into a single JAR.
    implementation 'io.grpc:grpc-netty-shaded:1.58.0'
    // Implementation dependency for gRPC's Protocol Buffer integration,
    // allowing gRPC services to use Protobuf messages.
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    // Implementation dependency for gRPC stubs, which are the client-side
    // and server-side interfaces generated from .proto service definitions.
    implementation 'io.grpc:grpc-stub:1.58.0'

    // Protobuf dependency:

    // Core Java library for Google Protocol Buffers. This is needed to work
    // with the generated Protobuf message classes.
    implementation 'com.google.protobuf:protobuf-java:3.24.0'

    // Other dependencies:

    // Provides standard annotation APIs (like @Generated), often required by
    // code generated by tools like Protobuf or gRPC.
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

// protobuf plugin - protoc compiler and related plugin behaviour setup
protobuf {
    // Configure the Protoc compiler
    protoc {
        // this version of protoc will be used for protoc compiler in tasks.
        artifact = "com.google.protobuf:protoc:3.24.0"
    }
    // Define Protobuf plugins that protoc should use.
    plugins {
        // Define the gRPC plugin for protoc. This plugin generates gRPC
        // service interfaces and stubs from your .proto service definitions.
        grpc {
            // Specify the artifact coordinates for the gRPC protoc plugin.
            artifact = 'io.grpc:protoc-gen-grpc-java:1.58.0'
        }
    }
    // Configure how proto generation tasks should behave.
    generateProtoTasks {
        // Apply the following configuration to all proto generation tasks.
        all()*.plugins {
            // For each task, enable the 'grpc' plugin. This ensures that
            // both Protobuf message classes and gRPC service classes are generated.
            grpc {}
        }
    }
}

// setting up paths for sources
// when we run protoc we will be getting two different set of data
// In grpc path we will get the service java files for extention
// In java path we will get the artifacts and its related builder classes
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}
